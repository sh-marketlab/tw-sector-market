name: update

on:
  schedule:
    - cron: "0 10 * * 1-5"    # 台北 18:00（收盤後：權證、法人、週五集保）
    - cron: "30 0 * * 2-6"    # 台北隔天 08:30（補 OpenAPI 晚更新的資料）
  workflow_dispatch:
    inputs:
      insti_days:
        description: "三大法人回補的日曆日數（第一次可填 90）"
        required: false
        default: "5"

permissions:
  contents: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch
        run: python scripts/fetch.py all --days "${{ github.event.inputs.insti_days || '5' }}"
      - name: Build
        run: |
          cp docs/data.json /tmp/prev_data.json 2>/dev/null || true
          python scripts/build.py
      - name: Notify (new signals → GitHub Issue → email)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/notify.py /tmp/prev_data.json docs/data.json
      - name: Backtest log (記錄新訊號、計算之後 5/10/20 日表現)
        continue-on-error: true
        run: python scripts/backtest.py /tmp/prev_data.json docs/data.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs config/market_map.json
          git diff --cached --quiet || git commit -m "data: update $(TZ=Asia/Taipei date +%F_%H%M)"
          git pull --rebase --autostash
          git push
